name: Release
# Disabled for tags: it still builds with Orbit 1.x scripts. Releases are made
# locally with ./build.sh and ./Tools/make-dmg.sh, then published with gh.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG (universal)
        run: VERSION="${GITHUB_REF_NAME#v}" UNIVERSAL=1 ./scripts/release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Orbit-*.dmg build/Orbit-*.dmg.sha256 --title "Orbit $GITHUB_REF_NAME" --generate-notes
