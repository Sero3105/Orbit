name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift run OrbitCheck
  universal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Universal build
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Check suite on both slices (x86_64 via Rosetta)
        run: |
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          lipo "$BIN/Orbit" -verify_arch arm64 x86_64
          arch -arm64 "$BIN/OrbitCheck"
          softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          arch -x86_64 "$BIN/OrbitCheck"
